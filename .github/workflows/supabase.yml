name: Deploy Supabase backend
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: bmyvvwyfgswjgktlsqlu

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secretlarni tekshirish (qiymatlar chiqarilmaydi)
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::SUPABASE: NOT DONE. GitHub Secrets yetishmayapti:$missing (Repo Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -z "$ADMIN_BOOTSTRAP_EMAIL" ] || [ -z "$ADMIN_BOOTSTRAP_PASSWORD" ]; then
            echo "::warning::ADMIN_BOOTSTRAP_EMAIL / ADMIN_BOOTSTRAP_PASSWORD secretlari yo'q: birinchi admin yaratilmaydi, Admin login ishlamaydi."
          elif [ ${#ADMIN_BOOTSTRAP_PASSWORD} -lt 10 ]; then
            echo "::error::ADMIN_BOOTSTRAP_PASSWORD kamida 10 belgi bo'lsin"; exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Loyihaga ulanish
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" >/dev/null

      - name: Database migrationlar
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Funksiya sirlari (faqat Supabase ichida saqlanadi)
        run: |
          set -e
          if [ -z "$ADMIN_JWT_SECRET" ]; then
            ADMIN_JWT_SECRET=$(openssl rand -hex 32)
            echo "::add-mask::$ADMIN_JWT_SECRET"
            echo "ADMIN_JWT_SECRET secreti berilmagan: tasodifiy kalit yaratildi (sessiyalar har deploydan keyin yangilanadi)."
          fi
          umask 077
          ENVF="$RUNNER_TEMP/fn.env"
          {
            echo "ADMIN_JWT_SECRET=$ADMIN_JWT_SECRET"
            [ -n "$ADMIN_BOOTSTRAP_EMAIL" ] && echo "ADMIN_BOOTSTRAP_EMAIL=$ADMIN_BOOTSTRAP_EMAIL"
            [ -n "$ADMIN_BOOTSTRAP_PASSWORD" ] && echo "ADMIN_BOOTSTRAP_PASSWORD=$ADMIN_BOOTSTRAP_PASSWORD"
          } > "$ENVF"
          supabase secrets set --project-ref "$PROJECT_REF" --env-file "$ENVF" --yes >/dev/null
          rm -f "$ENVF"

      - name: Edge Function deploy
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      - name: Smoke test (haqiqiy HTTPS javoblar)
        run: |
          set -e
          BASE="https://${PROJECT_REF}.supabase.co/functions/v1/api"
          echo "update:";  curl -fsS "$BASE/update"; echo
          echo "status:";  curl -fsS "$BASE/status"; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/admin/stats")
          [ "$code" = "401" ] || { echo "::error::SECURITY: tokensiz /admin/stats $code qaytardi (401 kutilgan)"; exit 1; }
          echo "Admin himoyasi: tokensiz 401 OK"
          dcode=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/donation-config")
          [ "$dcode" = "200" ] || { echo "::error::donation-config $dcode"; exit 1; }
          echo "Anon REST yopiqligi:"
          echo "(RLS yoqilgan, policy yo'q; anon kalit bilan jadvallar o'qilmaydi)"
          {
            echo "## Supabase deploy"
            echo "- API: $BASE"
            echo "- PB_ADMIN_API_URL = $BASE"
            echo "- PB_UPDATE_URL = $BASE/update"
            echo "- PB_DONATION_CONFIG_URL = $BASE/donation-config"
          } >> "$GITHUB_STEP_SUMMARY"

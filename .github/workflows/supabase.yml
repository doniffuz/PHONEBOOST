name: Deploy Supabase backend
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: bmyvvwyfgswjgktlsqlu

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ADMIN_ALLOWED_ORIGINS: ${{ vars.ADMIN_ALLOWED_ORIGINS }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Secretlarni tekshirish (qiymatlar chiqarilmaydi)
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::SUPABASE: NOT DONE. GitHub Secrets yetishmayapti:$missing (Repo Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ -z "$ADMIN_ALLOWED_ORIGINS" ]; then
            echo "::warning::ADMIN_ALLOWED_ORIGINS (repo Variable) yo'q: admin web panel brauzerdan ulana olmaydi (CORS yopiq). Hozircha bu xavfsiz holat."
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Loyihaga ulanish
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" >/dev/null

      - name: Database migrationlar
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Funksiya sozlamasi (sir emas; SERVICE_ROLE/ANON kalitlarni Supabase o'zi funksiyaga beradi)
        run: |
          set -e
          if [ -n "$ADMIN_ALLOWED_ORIGINS" ]; then
            printf 'ADMIN_ALLOWED_ORIGINS=%s\n' "$ADMIN_ALLOWED_ORIGINS" > "$RUNNER_TEMP/fn.env"
            supabase secrets set --project-ref "$PROJECT_REF" --env-file "$RUNNER_TEMP/fn.env" --yes >/dev/null
            rm -f "$RUNNER_TEMP/fn.env"
          fi

      - name: Edge Function deploy
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Smoke test (haqiqiy HTTPS javoblar)
        run: |
          set -e
          BASE="https://${PROJECT_REF}.supabase.co/functions/v1/api"
          echo "update:";  curl -fsS "$BASE/update"; echo
          echo "status:";  curl -fsS "$BASE/status"; echo
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/admin/stats")
          [ "$code" = "401" ] || { echo "::error::SECURITY: tokensiz /admin/stats $code qaytardi (401 kutilgan)"; exit 1; }
          echo "Admin himoyasi: tokensiz 401 OK"
          lc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"email":"nobody@example.invalid","password":"x"}' "$BASE/admin/login")
          [ "$lc" = "401" ] || [ "$lc" = "429" ] || { echo "::error::SECURITY: noto'g'ri login $lc (401/429 kutilgan)"; exit 1; }
          echo "Noto'g'ri login rad etildi: OK"
          oc=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"challengeId":"nope","code":"abc"}' "$BASE/admin/verify-otp")
          [ "$oc" = "400" ] || [ "$oc" = "429" ] || { echo "::error::SECURITY: verify-otp noto'g'ri format $oc"; exit 1; }
          echo "OTP format validatsiyasi: OK"
          dcode=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/donation-config")
          [ "$dcode" = "200" ] || { echo "::error::donation-config $dcode"; exit 1; }
          if [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            for t in donation_events donation_config audit_logs admin_profiles; do
              c=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" "https://${PROJECT_REF}.supabase.co/rest/v1/$t?select=*")
              case "$c" in 401|403) echo "anon REST $t: $c (yopiq) OK";; *) echo "::error::SECURITY: anon $t ga $c qaytdi"; exit 1;; esac
            done
          else
            echo "::warning::SUPABASE_ANON_KEY (repo Secret) yo'q: anon REST yopiqligi smoke testda tekshirilmadi (pgTAP testlari tekshiradi)"
          fi
          {
            echo "## Supabase deploy"
            echo "- API: $BASE"
            echo "- Admin web panel API = $BASE/admin/*"
            echo "- PB_UPDATE_URL = $BASE/update"
            echo "- PB_DONATION_CONFIG_URL = $BASE/donation-config"
          } >> "$GITHUB_STEP_SUMMARY"

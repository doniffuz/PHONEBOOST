name: Build PHONEBOOST
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # GitHub Release yaratish/fayl biriktirish uchun

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_PB_SUPPORT_URL: ${{ vars.PB_SUPPORT_URL }}
      ORG_GRADLE_PROJECT_PB_PRIVACY_POLICY_URL: ${{ vars.PB_PRIVACY_POLICY_URL }}
      ORG_GRADLE_PROJECT_PB_DONATION_URL: ${{ vars.PB_DONATION_URL }}
      ORG_GRADLE_PROJECT_PB_DONATION_CONFIG_URL: ${{ vars.PB_DONATION_CONFIG_URL || 'https://bmyvvwyfgswjgktlsqlu.supabase.co/functions/v1/api/donation-config' }}
      ORG_GRADLE_PROJECT_PB_UPDATE_URL: ${{ vars.PB_UPDATE_URL || 'https://bmyvvwyfgswjgktlsqlu.supabase.co/functions/v1/api/update' }}
      ORG_GRADLE_PROJECT_PB_ADMIN_API_URL: ${{ vars.PB_ADMIN_API_URL || 'https://bmyvvwyfgswjgktlsqlu.supabase.co/functions/v1/api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Gradle Wrapper (yo'q bo'lsa yaratiladi)
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.9; fi
          chmod +x gradlew

      - name: Keystore (GitHub Secrets)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore secrets yo'q — release UNSIGNED chiqadi"
          fi

      - name: Static checks (secrets, website, manifest)
        run: |
          set -e
          echo "== Forbidden hardcoded secrets =="
          if grep -rIn --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle --exclude-dir=.github \
              -E "BEGIN (RSA |EC )?PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_|storePassword[[:space:]]*=[[:space:]]*\"[^\"]+\"|[0-9]{4}[ -][0-9]{4}[ -][0-9]{4}[ -][0-9]{4}" . ; then
            echo "::error::Mumkin bo'lgan hardcoded secret topildi"; exit 1
          fi
          echo "OK"
          echo "== Backend secrets (service_role / DB parol / JWT) =="
          if grep -rIn --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle --exclude-dir=.github \
              -E "eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.|sb_secret_[A-Za-z0-9_-]+|postgres(ql)?://[^ \"']+:[^ \"'@]+@" . ; then
            echo "::error::Repo ichida service_role/JWT/DB parol topildi"; exit 1
          fi
          if grep -rIn --include=*.kt --include=*.kts --include=*.xml --include=*.js --include=*.html app website | grep -iE "service_role|SERVICE_ROLE_KEY"; then
            echo "::error::Client kodida service_role ga ishora bor"; exit 1
          fi
          grep -rIn "https://" app/build.gradle.kts >/dev/null || true
          echo "OK"
          echo "== Manifest =="
          M=app/src/main/AndroidManifest.xml
          if grep -q "android.permission.QUERY_ALL_PACKAGES" "$M"; then echo "::error::QUERY_ALL_PACKAGES manifestda bor"; exit 1; fi
          echo "QUERY_ALL_PACKAGES yo'q: OK"
          echo "== Website =="
          for id in home about features screenshots download support donation top10 contact privacy terms; do
            grep -q "id=\"$id\"" website/index.html || { echo "::error::website bo'limi yo'q: $id"; exit 1; }
          done
          for f in website/app.js website/i18n.js website/config.js; do node --check "$f"; done
          test -f website/404.html && test -f website/favicon.svg
          if grep -rn "http://" website --include=*.html --include=*.js --include=*.css; then echo "::error::website'da http:// havola bor"; exit 1; fi
          node -e "
            global.window={};require('./website/config.js');require('./website/i18n.js');
            const C=window.PB_CONFIG,D=window.PB_I18N;
            for(const k of ['DOWNLOAD_URL','DONATION_API']) if(C[k] && !/^https:\/\//.test(C[k])) throw new Error(k+' https bo\'lishi kerak');
            const keys=Object.keys(D.uz);
            for(const l of ['ru','en']) for(const k of keys) if(!(k in D[l])) throw new Error(l+' tarjimasi yo\'q: '+k);
          "
          grep -q "pages" .github/workflows/website.yml
          echo "Website: OK"
          echo "== Resources (XML + tillar paritetsi) =="
          python3 - <<'XMLCHECK'
import xml.etree.ElementTree as ET
from pathlib import Path

files = list(Path("app/src/main/res").rglob("*.xml"))
files.append(Path("app/src/main/AndroidManifest.xml"))

for f in files:
    try:
        ET.parse(f)
    except Exception as e:
        print(f"::error file={f}::XML xato: {e}")
        raise SystemExit(1)

print(f"XML tekshiruvi OK: {len(files)} ta fayl")
XMLCHECK
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, sys
          def keys(p): return {e.get('name') for e in ET.parse(p).getroot()}
          base = keys('app/src/main/res/values/strings.xml')
          bad = False
          for l in ('ru', 'en'):
              miss = base - keys(f'app/src/main/res/values-{l}/strings.xml')
              if miss:
                  print('::error::values-%s da tarjima yo\'q: %s' % (l, sorted(miss))); bad = True
          sys.exit(1 if bad else 0)
          PY
          echo "Resources: OK"

      - name: Lint + Unit tests
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew lintDebug testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee checks.log

      - name: Clean + Debug + Release APK + AAB
        id: build
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Validation
        id: validate
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          DBG=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "DEBUG APK:   $DBG"; echo "RELEASE APK: $APK"; echo "RELEASE AAB: $AAB"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          BADGE=$("$BT/aapt" dump badging "$APK" | grep "^package:")
          echo "$BADGE"
          WANT_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          WANT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "$BADGE" | grep -q "name='uz.phoneboost.app'" || { echo "::error::applicationId noto'g'ri"; exit 1; }
          echo "$BADGE" | grep -q "versionCode='$WANT_CODE'" || { echo "::error::versionCode mos emas"; exit 1; }
          echo "$BADGE" | grep -q "versionName='$WANT_NAME'" || { echo "::error::versionName mos emas"; exit 1; }
          PERMS=$("$BT/aapt" dump permissions "$APK"); echo "$PERMS"
          if echo "$PERMS" | grep -q QUERY_ALL_PACKAGES; then echo "::error::QUERY_ALL_PACKAGES release'da bor"; exit 1; fi
          SIGN="NOT CONFIGURED"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            "$BT/apksigner" verify --verbose "$APK"
            jarsigner -verify "$AAB" | head -3
            SIGN="SIGNED"
          else
            echo "::warning::SIGNING: NOT CONFIGURED (keystore secrets yo'q)"
          fi
          mkdir -p /tmp/apkx && unzip -oq "$APK" -d /tmp/apkx
          if grep -rl "com.google.android.gms.ads" /tmp/apkx --include='*.dex' >/dev/null 2>&1; then
            echo "::error::Release ichida reklama SDK topildi"; exit 1
          fi
          echo "Reklama SDK release'da yo'q: OK"
          if grep -rIlaE "service_role|SERVICE_ROLE|sb_secret_|postgres(ql)?://" /tmp/apkx >/dev/null 2>&1; then
            echo "::error::APK ichida backend secret izi topildi"; exit 1
          fi
          echo "APK ichida service_role/DB parol yo'q: OK"
          {
            echo "## PHONEBOOST build"
            echo "- Debug APK: $(basename "$DBG")"
            echo "- Release APK: $(basename "$APK") — **$SIGN**"
            echo "- Release AAB: $(basename "$AAB") — **$SIGN**"
            echo "- $BADGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Natija fayllarini tayyorlash (dist/)
        id: dist
        run: |
          set -e
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then SUF=""; else SUF="_UNSIGNED"; fi
          cp app/build/outputs/apk/debug/*.apk dist/PHONEBOOST-debug.apk
          cp app/build/outputs/apk/release/*.apk "dist/PHONEBOOST-release${SUF}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/PHONEBOOST-release${SUF}.aab"
          echo "suffix=$SUF" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: BUILD_REPORT.txt
        if: always()
        run: |
          mkdir -p dist
          {
            echo "PHONEBOOST BUILD REPORT"
            echo "========================"
            echo "Sana (UTC):     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit:         ${GITHUB_SHA}"
            echo "Branch/Ref:     ${GITHUB_REF_NAME}"
            echo "Workflow run:   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Job natijasi:   ${{ job.status }}"
            echo "Gradle build:   ${{ steps.build.outcome }}"
            echo "Validation:     ${{ steps.validate.outcome }}"
            echo "Lint + Tests:   ${{ steps.checks.outcome }} (lintDebug, testDebugUnitTest)"
            echo "Package ID:     uz.phoneboost.app"
            echo "Fayllar tayyor: ${{ steps.dist.outcome }}"
            echo "Imzo:           $([ '${{ steps.signing.outputs.signed }}' = 'true' ] && echo 'SIGNED (GitHub Secrets keystore)' || echo 'NOT CONFIGURED (keystore secrets berilmagan; release APK imzosiz)')"
            echo "Java:           $(java -version 2>&1 | head -1)"
            echo "Gradle:         $(./gradlew --version 2>/dev/null | grep '^Gradle' || echo n/a)"
            echo "AGP/Kotlin:     8.7.3 / 2.0.21"
            echo "versionName:    $(grep -oP 'versionName\s*=\s*\"\K[^\"]+' app/build.gradle.kts | head -1)"
            echo "versionCode:    $(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)"
            echo
            echo "Fayllar:"
            if ls dist/*.apk dist/*.aab >/dev/null 2>&1; then
              (cd dist && sha256sum *.apk *.aab && ls -l *.apk *.aab)
            else
              echo "  (build fayllari yaratilmadi — build.log ga qarang)"
            fi
            if [ -f build.log ] && grep -qE '^e: |What went wrong|BUILD FAILED' build.log; then
              echo
              echo "KOMPILYATSIYA / GRADLE XATOLARI (build.log dan, fayl:qator bilan):"
              grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -60
              grep -A6 'What went wrong' build.log | head -30
            fi
            echo
            echo "Known limitations: build CI ishidan oldin lokal tasdiqlanmagan; Animation Speed WRITE_SECURE_SETTINGS ni faqat ADB bilan oladi; Admin Panel backend YO'Q (NOT DONE); donation statistikasi backend YO'Q; karta ma'lumoti PB_DONATION_CONFIG_URL (HTTPS) orqali olinadi."
            echo "Eslatma: bu hisobot faqat shu workflow ishida haqiqatan bajarilgan qadamlarni ko'rsatadi."
            echo
            echo "STATUSLAR"
            echo "---------"
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              echo "DONE: Gradle build (clean assembleDebug assembleRelease bundleRelease) shu CI ishida muvaffaqiyatli bajarildi"
              echo "BUILD STATUS: BUILD SUCCESS (faqat shu CI run, commit ${GITHUB_SHA})"
            else
              echo "BUILD STATUS: BUILD FAILED (build.log / yuqoridagi xatolar ro'yxatiga qarang)"
            fi
            if [ "${{ steps.checks.outcome }}" = "success" ]; then
              echo "DONE: lintDebug + testDebugUnitTest o'tdi"
            else
              echo "LINT/TESTS: FAILED yoki bajarilmadi (checks.log ga qarang)"
            fi
            echo "DEVICE NOT TESTED: haqiqiy telefonda sinov (Animation Speed, PDF, bildirishnoma, Game Boost) bu CI bilan tasdiqlanmagan"
            if [ -z "${ORG_GRADLE_PROJECT_PB_ADMIN_API_URL}" ]; then
              echo "BACKEND REQUIRED: PB_ADMIN_API_URL sozlanmagan, Admin Panel 'Backend connection required' ko'rsatadi"
            else
              echo "BACKEND: URL'lar berilgan; backend deploy 'Deploy Supabase backend' workflow'i smoke testi bilan tekshiriladi"
            fi
            if [ -z "${ORG_GRADLE_PROJECT_PB_UPDATE_URL}" ]; then echo "UPDATE: PB_UPDATE_URL sozlanmagan (ilovada 'Sozlanmagan' ko'rsatiladi)"; fi
            if [ -z "${ORG_GRADLE_PROJECT_PB_DONATION_CONFIG_URL}" ]; then echo "DONATION: PB_DONATION_CONFIG_URL sozlanmagan (karta ko'rsatilmaydi)"; fi
            if [ '${{ steps.signing.outputs.signed }}' = 'true' ]; then
              echo "SIGNING: CONFIGURED (signed release)"
            else
              echo "SIGNING: NOT CONFIGURED"
              echo "SIGNING NOT CONFIGURED: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets yo'q"
            fi
          } > dist/BUILD_REPORT.txt
          cp build.log dist/BUILD_LOG.txt 2>/dev/null || true
          cat dist/BUILD_REPORT.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PHONEBOOST-build-report-and-log
          path: |
            dist/BUILD_REPORT.txt
            dist/BUILD_LOG.txt
      - uses: actions/upload-artifact@v4
        if: steps.dist.outcome == 'success'
        with:
          name: PHONEBOOST-debug-apk
          path: dist/PHONEBOOST-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.dist.outcome == 'success'
        with:
          name: PHONEBOOST-release-apk
          path: dist/PHONEBOOST-release*.apk
      - uses: actions/upload-artifact@v4
        if: steps.dist.outcome == 'success'
        with:
          name: PHONEBOOST-release-aab
          path: dist/PHONEBOOST-release*.aab

      - name: GitHub Release (push/Run workflow uchun yangi, Release yaratilganda mavjudiga biriktiriladi)
        if: steps.dist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          FILES=$(ls dist/*.apk dist/*.aab dist/BUILD_REPORT.txt)
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "${{ github.event.release.tag_name }}" $FILES --clobber
          else
            TAG="build-${{ github.run_number }}"
            gh release create "$TAG" $FILES --prerelease \
              --title "PHONEBOOST build #${{ github.run_number }}" \
              --notes-file dist/BUILD_REPORT.txt
          fi

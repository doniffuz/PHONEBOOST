name: Create release keystore (bir marta)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Keystore yaratish (qiymatlar logga chiqmaydi)
        run: |
          set -e
          umask 077
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          keytool -genkeypair -v -keystore release.jks -alias phoneboost -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=PHONEBOOST, O=Donyor Abdullayev, C=UZ" >/dev/null 2>&1
          mkdir -p out
          {
            echo "KEYSTORE_PASSWORD:"; echo "$PW"; echo
            echo "KEY_PASSWORD:"; echo "$PW"; echo
            echo "KEY_ALIAS:"; echo "phoneboost"; echo
            echo "KEYSTORE_BASE64:"; base64 -w0 release.jks; echo
          } > out/GITHUB_SECRETS.txt
          cp release.jks out/release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: PHONEBOOST-keystore-PRIVATE
          path: out/
          retention-days: 1
